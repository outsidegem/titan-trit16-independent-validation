name: TRIT16 External Consumer Integration

on:
  push:
    branches:
      - integration/phase-a-consumer-harness
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-c-consumer:
    name: Linux x86_64 C consumer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install C build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build SDK shared library
        run: cargo build --release -p titan_trit16_ffi

      - name: Configure independent C consumer
        run: |
          cmake -S integration/linux-consumer \
            -B build/trit16-linux-consumer \
            -DTITAN_TRIT16_LIB_DIR="$GITHUB_WORKSPACE/target/release"

      - name: Build and test independent C consumer
        run: |
          cmake --build build/trit16-linux-consumer --parallel
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build/trit16-linux-consumer --output-on-failure

  linux-arm64-c-consumer:
    name: Linux ARM64 C consumer
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install C build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run full Rust workspace tests
        run: cargo test --workspace -j 1

      - name: Build ARM64 SDK shared library
        run: cargo build --release -p titan_trit16_ffi

      - name: Configure ARM64 C consumer
        run: |
          cmake -S integration/linux-consumer \
            -B build/trit16-linux-arm64-consumer \
            -DTITAN_TRIT16_LIB_DIR="$GITHUB_WORKSPACE/target/release"

      - name: Build and test ARM64 C consumer
        run: |
          cmake --build build/trit16-linux-arm64-consumer --parallel
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build/trit16-linux-arm64-consumer --output-on-failure

  windows-x64-c-consumer:
    name: Windows x64 MSVC C consumer
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Windows SDK DLL
        run: cargo build --release -p titan_trit16_ffi

      - name: Locate DLL and import library
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "target\release"
          $dll = Join-Path $releaseDir "titan_trit16_ffi.dll"
          $importLib = Get-ChildItem $releaseDir -Filter "titan_trit16_ffi*.lib" |
            Select-Object -First 1

          if (!(Test-Path $dll)) {
            throw "Rust SDK DLL was not produced: $dll"
          }

          if ($null -eq $importLib) {
            Get-ChildItem $releaseDir
            throw "Rust SDK import library was not produced."
          }

          "TITAN_TRIT16_IMPORT_LIB=$($importLib.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Add-Content -Path $env:GITHUB_PATH -Value $releaseDir

      - name: Configure independent Windows C consumer
        shell: pwsh
        run: |
          cmake -S integration/linux-consumer `
            -B build/trit16-windows-consumer `
            -A x64 `
            "-DTITAN_TRIT16_LIB_DIR=$env:GITHUB_WORKSPACE\target\release" `
            "-DTITAN_TRIT16_LIBRARY=$env:TITAN_TRIT16_IMPORT_LIB"

      - name: Build and test Windows C consumer
        shell: pwsh
        run: |
          cmake --build build/trit16-windows-consumer --config Release --parallel
          ctest --test-dir build/trit16-windows-consumer -C Release --output-on-failure

  android-aar-consumer:
    name: Android AAR external consumer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android native libraries
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o android/src/main/jniLibs \
            build --release -p titan_trit16_ffi

      - name: Build SDK AAR
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease

          AAR_SOURCE="$(find build/outputs/aar -maxdepth 1 -type f -name '*.aar' -print -quit)"

          if [ -z "$AAR_SOURCE" ]; then
            echo "::error::Gradle completed but no AAR was found."
            find build/outputs -maxdepth 4 -type f -print || true
            exit 1
          fi

          AAR_TARGET="build/outputs/aar/titan-trit16-0.1.0.aar"

          if [ "$AAR_SOURCE" != "$AAR_TARGET" ]; then
            cp "$AAR_SOURCE" "$AAR_TARGET"
          fi

          test -s "$AAR_TARGET"
          echo "Verified SDK AAR: $AAR_TARGET"
          unzip -l "$AAR_TARGET"

      - name: Upload SDK AAR for physical-device validation
        uses: actions/upload-artifact@v4
        with:
          name: titan-trit16-sdk-aar
          path: android/build/outputs/aar/titan-trit16-0.1.0.aar
          if-no-files-found: error
          retention-days: 14

      - name: Stage AAR into independent consumer
        run: |
          mkdir -p integration/android-consumer/app/libs
          test -s android/build/outputs/aar/titan-trit16-0.1.0.aar
          cp android/build/outputs/aar/titan-trit16-0.1.0.aar \
            integration/android-consumer/app/libs/titan-trit16-0.1.0.aar
          test -s integration/android-consumer/app/libs/titan-trit16-0.1.0.aar
          echo "SDK AAR staged successfully."

      - name: Build independent Android application
        working-directory: integration/android-consumer
        run: gradle --no-daemon :app:assembleDebug

      - name: Run independent consumer instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: cd integration/android-consumer && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload Android consumer APKs for device testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-trit16-android-device-apks
          path: |
            integration/android-consumer/app/build/outputs/apk/debug/*.apk
            integration/android-consumer/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android consumer test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trit16-android-consumer-test-reports
          path: integration/android-consumer/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
