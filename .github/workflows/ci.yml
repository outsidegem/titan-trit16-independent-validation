name: TRIT16 SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  android-aar:
    name: Android AAR packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8'

      - name: Assemble AAR
        working-directory: android
        run: gradle --no-daemon assembleAar

      - name: Verify AAR contents
        working-directory: android
        run: |
          AAR="build/outputs/aar/titan-trit16-0.1.0.aar"
          test -f "$AAR"
          unzip -l "$AAR" | grep -q 'classes.jar'
          unzip -l "$AAR" | grep -q 'jni/arm64-v8a/libtitan_trit16_ffi.so'

      - uses: actions/upload-artifact@v4
        with:
          name: titan-trit16-android-aar
          path: android/build/outputs/aar/titan-trit16-0.1.0.aar
