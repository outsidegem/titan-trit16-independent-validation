name: TRIT16 Security Checks

on:
  push:
    branches: [main, workflows/trit16-validation-suite]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

      - name: Check unsafe-code declarations
        run: |
          grep -R -nE '#!\[forbid\(unsafe_code\)\]|#!\[deny\(unsafe_op_in_unsafe_fn\)\]' \
            core ffi titan-mcp
