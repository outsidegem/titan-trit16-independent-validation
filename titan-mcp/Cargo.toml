[package]
name = "titan_trit16_mcp"
version = "0.1.0"
edition = "2021"
description = "Local-first Model Context Protocol (MCP) JSON-RPC 2.0 server for Titan Trit16"
license = "MIT OR Apache-2.0"

[[bin]]
name = "titan-mcp-server"
path = "src/main.rs"

[dependencies]
titan_trit16_core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
